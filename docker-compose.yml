version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iars_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeStrong123!}
      POSTGRES_DB: iars_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iars_user -d iars_db"]
      interval: 5s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    profiles: ["mongo"] # enable with `docker compose --profile mongo up`
    environment:
      MONGO_INITDB_ROOT_USERNAME: iars_mongo
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ChangeMeMongo123!}
      MONGO_INITDB_DATABASE: iars_db
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://iars_user:${POSTGRES_PASSWORD:-ChangeMeStrong123!}@postgres:5432/iars_db?schema=public
      NODE_ENV: production
    ports:
      - "4000:4000"
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:4000/api/v1

volumes:
  pgdata:
  mongodata:
